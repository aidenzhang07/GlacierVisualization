<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GlacierIQ — Transition · {{ glac_id }}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0a0c0f;
      --surface:  #111318;
      --border:   #1c2028;
      --border2:  #252b35;
      --text:     #b8cfe0;
      --text-dim: #5a7080;
      --head:     #e8f0f6;
      --white:    #ffffff;
      --accent:   #4a9eca;
      --nav-h:    56px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--text);
      font-family:'Outfit',sans-serif; font-size:15px; min-height:100vh;
    }

    /* ── NAV ── */
    .nav {
      position:fixed; top:0; left:0; right:0; z-index:2000;
      height:var(--nav-h);
      background:rgba(10,12,15,0.94); backdrop-filter:blur(24px);
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 32px;
    }
    .nav-brand {
      font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem;
      color:var(--white); text-decoration:none;
      letter-spacing:-0.02em; margin-right:auto;
    }
    .nav-brand b { color:var(--accent); }
    .nav-links { display:flex; gap:2px; list-style:none; }
    .nav-links a {
      display:flex; align-items:center; padding:6px 16px; border-radius:6px;
      font-size:13px; font-weight:500; letter-spacing:0.04em;
      color:var(--text-dim); text-decoration:none;
      transition:color 0.15s, background 0.15s;
    }
    .nav-links a:hover { color:var(--head); background:rgba(255,255,255,0.04); }
    .nav-links a.active { color:var(--accent); background:rgba(74,158,202,0.08); }

    /* ── LAYOUT ── */
    .page { padding-top:var(--nav-h); }

    .page-header {
      max-width:1160px; margin:0 auto;
      padding:28px 28px 16px;
      display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
    }
    .breadcrumb { font-size:12px; color:var(--text-dim); }
    .breadcrumb a { color:var(--accent); text-decoration:none; }
    .breadcrumb a:hover { color:var(--head); }
    .page-title {
      font-family:'Syne',sans-serif; font-weight:700;
      font-size:clamp(1.4rem,3vw,2rem); letter-spacing:-0.03em;
      color:var(--head);
    }

    /* meta pills */
    .meta-row {
      max-width:1160px; margin:0 auto 16px;
      padding:0 28px;
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .meta-pill {
      background:var(--surface); border:1px solid var(--border);
      border-radius:8px; padding:10px 16px;
      display:flex; flex-direction:column; gap:3px;
    }
    .meta-pill strong {
      font-size:9px; letter-spacing:0.16em; text-transform:uppercase;
      color:var(--text-dim); font-weight:500;
    }
    .meta-pill span { font-size:13px; color:var(--head); font-weight:500; }

    /* map */
    #map {
      width:calc(100% - 56px); margin:0 auto 16px;
      height:60vh; min-height:400px; max-height:720px;
      border-radius:12px; border:1px solid var(--border);
      overflow:hidden; background:#080a0d;
      display:block;
    }

    /* controls bar */
    .controls {
      max-width:1160px; margin:0 auto 16px; padding:0 28px;
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .ctrl-btn {
      background:var(--surface); border:1px solid var(--border2);
      color:var(--text); font-family:'Outfit',sans-serif;
      font-size:12px; font-weight:500;
      padding:8px 18px; border-radius:7px; cursor:pointer;
      transition:all 0.15s; white-space:nowrap;
    }
    .ctrl-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
    .ctrl-btn:disabled { opacity:0.3; cursor:not-allowed; }
    .ctrl-btn.playing { border-color:var(--accent); color:var(--accent); background:rgba(74,158,202,0.08); }

    input[type=range] {
      flex:1; min-width:140px; height:28px;
      accent-color:var(--accent); background:transparent; border:none;
    }
    .year-badge {
      font-family:'Syne',sans-serif; font-weight:700; font-size:1.1rem;
      color:var(--head); min-width:52px; text-align:center;
    }

    /* status bar */
    .status-bar {
      max-width:1160px; margin:0 auto 32px; padding:0 28px;
    }
    .status-inner {
      background:var(--surface); border:1px solid var(--border);
      border-radius:8px; padding:11px 16px;
      font-size:12px; color:var(--text-dim); line-height:1.5;
    }

    /* leaflet dark overrides */
    .leaflet-popup-content-wrapper {
      background:rgba(10,12,15,0.97) !important; color:var(--head) !important;
      border-radius:10px !important; border:1px solid var(--border2) !important;
      font-family:'Outfit',sans-serif !important;
    }
    .leaflet-popup-tip { background:rgba(10,12,15,0.97) !important; }
    .leaflet-control-attribution {
      background:rgba(10,12,15,0.7) !important; color:var(--text-dim) !important;
      font-size:10px !important;
    }
    .leaflet-control-scale-line {
      background:rgba(10,12,15,0.75) !important; border-color:var(--border2) !important;
      color:var(--text-dim) !important; font-family:'Outfit',sans-serif !important; font-size:10px !important;
    }
    .leaflet-control-zoom a {
      background:rgba(10,12,15,0.9) !important; color:var(--text) !important;
      border-color:var(--border2) !important;
    }
    .leaflet-control-zoom a:hover { background:rgba(74,158,202,0.2) !important; color:var(--accent) !important; }
    .leaflet-control-zoom a:first-child { border-radius:8px 8px 0 0 !important; }
    .leaflet-control-zoom a:last-child  { border-radius:0 0 8px 8px !important; }
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="/"><b>Glacier</b>IQ</a>
  <ul class="nav-links">
    <li><a href="/">Map</a></li>
    <li><a href="/about">About</a></li>
  </ul>
</nav>

<div class="page">
  <div class="page-header">
    <span class="breadcrumb"><a href="/map">← Map</a></span>
    <h1 class="page-title">Glacier Transition View</h1>
  </div>

  <div class="meta-row">
    <div class="meta-pill">
      <strong>Glacier ID</strong>
      <span>{{ glac_id }}</span>
    </div>
    <div class="meta-pill">
      <strong>Year</strong>
      <span id="yearDisplay">—</span>
    </div>
    <div class="meta-pill">
      <strong>Observations</strong>
      <span id="yearCount">—</span>
    </div>
    <div class="meta-pill">
      <strong>Span</strong>
      <span id="timelineText">—</span>
    </div>
  </div>

  <div id="map"></div>

  <div class="controls">
    <button class="ctrl-btn" id="btnPrev" disabled>◀ Prev</button>
    <button class="ctrl-btn" id="btnPlay" disabled>▶ Play</button>
    <input type="range" id="yearSlider" min="0" max="0" value="0" step="1" disabled/>
    <span class="year-badge" id="yearBadge">—</span>
    <button class="ctrl-btn" id="btnNext" disabled>Next ▶</button>
  </div>

  <div class="status-bar">
    <div class="status-inner" id="status">Fetching glacier polygon timeline…</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  const glacierId   = {{ glac_id | tojson }};
  const yearDisplay = document.getElementById('yearDisplay');
  const yearCount   = document.getElementById('yearCount');
  const timelineText= document.getElementById('timelineText');
  const yearBadge   = document.getElementById('yearBadge');
  const statusEl    = document.getElementById('status');
  const yearSlider  = document.getElementById('yearSlider');
  const btnPrev     = document.getElementById('btnPrev');
  const btnNext     = document.getElementById('btnNext');
  const btnPlay     = document.getElementById('btnPlay');

  const map = L.map('map', { preferCanvas:true, zoomControl:true, scrollWheelZoom:true });

  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution:'&copy; Esri, Maxar, Earthstar Geographics', maxZoom:18 }
  ).addTo(map);

  L.control.scale({ position:'bottomleft', imperial:true, metric:true }).addTo(map);

  const polyLayer = L.layerGroup().addTo(map);
  let years=[], groups={}, idx=0, playing=null, bounds=null;

  function sync() {
    const n = years.length;
    yearSlider.disabled = n<=1; btnPlay.disabled = n<=1;
    btnPrev.disabled = idx===0; btnNext.disabled = idx===n-1;
    yearSlider.max = Math.max(0,n-1); yearSlider.value = idx;
    const y = years[idx]||'—';
    yearDisplay.textContent = y; yearBadge.textContent = y;
    yearCount.textContent   = n;
    timelineText.textContent= n ? `${years[0]} → ${years[n-1]}` : '—';
  }

  function render(i) {
    idx = Math.max(0, Math.min(years.length-1, i));
    sync();
    polyLayer.clearLayers();
    const active = years[idx];
    years.forEach(yr => {
      const cur = yr===active;
      const style = {
        color:       cur ? '#4a9eca' : 'rgba(74,158,202,0.35)',
        fillColor:   cur ? 'rgba(74,158,202,0.28)' : 'rgba(74,158,202,0.06)',
        weight:      cur ? 3 : 1.2,
        fillOpacity: cur ? 0.32 : 0.10,
      };
      groups[yr].forEach(f => polyLayer.addLayer(L.geoJSON(f,{style,interactive:false})));
    });
    if (bounds) map.fitBounds(bounds, {padding:[16,16]});
  }

  async function load() {
    try {
      const r = await fetch(`/api/glacier-transition-data/${encodeURIComponent(glacierId)}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      const feats = d.features||[];
      if (!feats.length) { statusEl.textContent='No polygon features found for this glacier ID.'; return; }
      feats.forEach(f => {
        const yr = (f.properties?.src_date||'').slice(0,4)||'unknown';
        groups[yr] = groups[yr]||[]; groups[yr].push(f);
      });
      years = Object.keys(groups).sort((a,b)=>+a-+b);
      bounds = L.geoJSON(feats).getBounds();
      render(0);
      statusEl.textContent = `${feats.length} polygon records across ${years.length} observation year(s).`;
    } catch(e) {
      statusEl.textContent = `Failed to load: ${e.message}`;
    }
  }

  btnPrev.addEventListener('click', ()=>render(idx-1));
  btnNext.addEventListener('click', ()=>render(idx+1));
  yearSlider.addEventListener('input', e=>render(+e.target.value));
  btnPlay.addEventListener('click', () => {
    if (playing) {
      clearInterval(playing); playing=null;
      btnPlay.textContent='▶ Play'; btnPlay.classList.remove('playing');
    } else {
      btnPlay.textContent='⏸ Pause'; btnPlay.classList.add('playing');
      playing = setInterval(()=>render((idx+1)%years.length), 1100);
    }
  });

  load();
</script>
</body>
</html>
