<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glacier Transition · {{ glac_id }}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --deep: #071b2b;
      --ice: #d6eef8;
      --glacier: #d020c8;
      --glacier-soft: #f3c0f7;
      --panel: rgba(255,255,255,0.06);
      --border: rgba(168,216,234,0.16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(79,195,247,0.08), transparent 35%),
                  linear-gradient(180deg, #071b2b 0%, #05121b 100%);
      color: var(--ice);
      font-family: 'DM Mono', monospace;
    }

    header {
      padding: 24px 24px 12px;
      max-width: 1160px;
      margin: 0 auto;
    }

    .breadcrumb {
      margin-bottom: 12px;
      font-size: 0.82rem;
    }
    .breadcrumb a {
      color: #a8d8ea;
      text-decoration: none;
    }

    h1 {
      margin: 0 0 10px;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.02em;
    }

    .subtitle {
      max-width: 760px;
      color: #7aafc5;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .meta-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
      padding: 0 24px;
    }

    .meta-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
    }

    .meta-card strong {
      display: block;
      margin-bottom: 8px;
      color: #b7d7f0;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #map {
      width: calc(100% - 48px);
      height: 62vh;
      max-height: 760px;
      margin: 0 auto 18px;
      border-radius: 24px;
      border: 1px solid var(--border);
      overflow: hidden;
      background: #07121f;
    }

    .controls {
      max-width: 1160px;
      margin: 0 auto 32px;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .controls button,
    .controls input[type=range] {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ice);
      font-family: inherit;
    }

    .controls button {
      padding: 12px 18px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .controls button:hover {
      background: rgba(255,255,255,0.12);
    }

    .controls input[type=range] {
      flex: 1;
      min-width: 200px;
      height: 34px;
      accent-color: #d020c8;
    }

    .status {
      margin: 0 auto 32px;
      max-width: 1160px;
      padding: 18px 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      color: #cfe7ff;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    a.page-link {
      color: #8cd3ff;
      text-decoration: none;
      border-bottom: 1px solid rgba(140,211,255,0.4);
    }
  </style>
</head>
<body>
  <header>
    <div class="breadcrumb"><a href="/">← Back to glacier map</a></div>
    <h1>Glacier transition view</h1>
    <p class="subtitle">This page shows a fixed satellite base map and then renders the glacier's actual polygon observations across available years.</p>
  </header>

  <div class="meta-row">
    <div class="meta-card">
      <strong>Glacier ID</strong>
      <div id="glacierId">{{ glac_id }}</div>
    </div>
    <div class="meta-card">
      <strong>Selected year</strong>
      <div id="yearLabel">Loading…</div>
    </div>
    <div class="meta-card">
      <strong>Available years</strong>
      <div id="yearCount">0</div>
    </div>
  </div>

  <div id="map"></div>

  <div class="controls">
    <button id="btnPrev" disabled>◀ Previous</button>
    <button id="btnPlay" disabled>▶ Play</button>
    <input id="yearSlider" type="range" min="0" max="0" step="1" value="0" disabled />
    <span id="timelineText">Loading years...</span>
  </div>

  <div class="status" id="status">Fetching glacier polygon timeline...</div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const glacierId = {{ glac_id | tojson }};
    const yearLabel = document.getElementById('yearLabel');
    const yearCountEl = document.getElementById('yearCount');
    const statusEl = document.getElementById('status');
    const yearSlider = document.getElementById('yearSlider');
    const btnPrev = document.getElementById('btnPrev');
    const btnPlay = document.getElementById('btnPlay');
    const timelineText = document.getElementById('timelineText');

    const map = L.map('map', {
      preferCanvas: true,
      zoomControl: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      attributionControl: true,
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: '&copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community',
      maxZoom: 18,
    }).addTo(map);

    const polygonLayer = L.layerGroup().addTo(map);
    let years = [];
    let yearGroups = {};
    let currentIndex = 0;
    let playInterval = null;
    let boundsAll = null;

    function formatTimeline() {
      if (!years.length) return 'No years available';
      return `${years[0]} → ${years[years.length - 1]}`;
    }

    function updateControls() {
      yearSlider.disabled = years.length <= 1;
      yearSlider.max = Math.max(0, years.length - 1);
      yearSlider.value = currentIndex;
      btnPrev.disabled = currentIndex === 0;
      btnPlay.disabled = years.length <= 1;
      timelineText.textContent = formatTimeline();
      yearCountEl.textContent = years.length;
      yearLabel.textContent = years[currentIndex] || 'N/A';
    }

    function renderYear(index) {
      if (!years.length) return;
      currentIndex = index;
      updateControls();
      polygonLayer.clearLayers();
      const highlightYear = years[index];

      years.forEach((year, idx) => {
        const isCurrent = year === highlightYear;
        const style = {
          color: isCurrent ? '#d020c8' : '#f8a0f4',
          fillColor: isCurrent ? 'rgba(208,32,200,0.32)' : 'rgba(208,32,200,0.12)',
          weight: isCurrent ? 4 : 2,
          fillOpacity: isCurrent ? 0.34 : 0.18,
        };

        yearGroups[year].forEach(feature => {
          polygonLayer.addLayer(L.geoJSON(feature, {
            style,
            interactive: false,
          }));
        });
      });

      if (boundsAll) {
        map.fitBounds(boundsAll, { padding: [14, 14] });
      }
    }

    async function fetchTransitionData() {
      try {
        const res = await fetch(`/api/glacier-transition-data/${encodeURIComponent(glacierId)}`);
        if (!res.ok) {
          throw new Error(`Server returned ${res.status}`);
        }
        const data = await res.json();
        const features = data.features || [];
        if (!features.length) {
          statusEl.textContent = 'No glacier polygon features available for this ID.';
          return;
        }

        features.forEach(feature => {
          const srcDate = feature.properties?.src_date || '';
          const year = srcDate.slice(0, 4) || 'unknown';
          yearGroups[year] = yearGroups[year] || [];
          yearGroups[year].push(feature);
        });

        years = Object.keys(yearGroups).sort((a, b) => Number(a) - Number(b));
        if (!years.length) {
          statusEl.textContent = 'No dated features available in glacier polygon data.';
          return;
        }

        boundsAll = L.geoJSON(features).getBounds();
        renderYear(0);
        statusEl.textContent = `Loaded ${features.length} polygon features for ${glacierId}.`;
      } catch (err) {
        statusEl.textContent = `Failed to load glacier data: ${err.message}`;
        console.error(err);
      }
    }

    btnPrev.addEventListener('click', () => {
      renderYear(Math.max(0, currentIndex - 1));
    });

    btnPlay.addEventListener('click', () => {
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
        btnPlay.textContent = '▶ Play';
        return;
      }
      btnPlay.textContent = '⏸ Pause';
      playInterval = setInterval(() => {
        const nextIndex = (currentIndex + 1) % years.length;
        renderYear(nextIndex);
      }, 1100);
    });

    yearSlider.addEventListener('input', (event) => {
      renderYear(Number(event.target.value));
    });

    fetchTransitionData();
  </script>
</body>
</html>
