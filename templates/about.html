<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GlacierIQ — About</title>
  <link rel="icon" href="/static/icons/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0a0c0f;
      --surface:  #111318;
      --border:   #1c2028;
      --border2:  #252b35;
      --text:     #b8cfe0;
      --text-dim: #5a7080;
      --head:     #e8f0f6;
      --white:    #ffffff;
      --accent:   #4a9eca;
      --nav-h:    56px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--text);
      font-family:'Outfit',sans-serif; font-size:15px; line-height:1.6;
      min-height:100vh;
    }
    .nav {
      position:fixed; top:0; left:0; right:0; z-index:1000;
      height:var(--nav-h);
      background:rgba(10,12,15,0.88); backdrop-filter:blur(24px);
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 32px;
    }
    .nav-brand {
      font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem;
      color:var(--white); text-decoration:none; letter-spacing:-0.02em; margin-right:auto;
    }
    .nav-brand b { color:var(--accent); }
    .nav-links { display:flex; gap:2px; list-style:none; }
    .nav-links a {
      display:flex; align-items:center; padding:6px 16px; border-radius:6px;
      font-size:13px; font-weight:500; letter-spacing:0.04em;
      color:var(--text-dim); text-decoration:none;
      transition:color 0.15s, background 0.15s;
    }
    .nav-links a:hover { color:var(--head); background:rgba(255,255,255,0.04); }
    .nav-links a.active { color:var(--accent); background:rgba(74,158,202,0.08); }

    .page {
      padding-top: calc(var(--nav-h) + 64px);
      max-width: 720px; margin:0 auto;
      padding-left:24px; padding-right:24px; padding-bottom:100px;
    }
    .section-label {
      font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
      color:var(--accent); margin-bottom:12px; font-weight:500;
    }
    h1 {
      font-family:'Syne',sans-serif; font-weight:800;
      font-size:clamp(2rem,5vw,3.2rem); letter-spacing:-0.04em;
      color:var(--head); margin-bottom:40px; line-height:1.05;
    }
    .placeholder {
      border:1px dashed var(--border2); border-radius:12px;
      padding:72px 40px; text-align:center;
    }
    .placeholder p {
      font-family:'Syne',sans-serif; font-weight:600;
      font-size:13px; letter-spacing:0.1em; text-transform:uppercase;
      color:var(--border2); margin-bottom:8px;
    }
    .placeholder small { font-size:12px; color:#2a3540; }

    footer {
      border-top:1px solid var(--border); padding:24px 32px;
      font-size:12px; color:var(--text-dim); text-align:center;
    }
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="/"><b>Glacier</b>IQ</a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/map">Map</a></li>
    <li><a href="/about" class="active">About</a></li>
  </ul>
</nav>

<main class="page">
  <p class="section-label">Project</p>
  <h1>About GlacierIQ</h1>
  <div class="placeholder">
    <p>Content coming soon</p>
    <small>Project background, data sources, methodology, and acknowledgements</small>
  </div>
</main>

<footer>GlacierIQ — Senior Capstone · Aiden Zhang</footer>

</body>
</html>
